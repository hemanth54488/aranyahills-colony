<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square - deep forest green -->
  <rect width="64" height="64" rx="14" fill="#14532d"/>
  <!-- Subtle inner gradient overlay -->
  <rect width="64" height="64" rx="14" fill="url(#grad)" opacity="0.6"/>
  <!-- Gold leaf body -->
  <path d="M32 8 C38 8 50 16 50 30 C50 42 42 56 32 58 C22 56 14 42 14 30 C14 16 26 8 32 8Z" fill="#fbbf24"/>
  <!-- Leaf shine highlight -->
  <path d="M32 12 C36 12 45 18 45 29 C45 35 42 43 37 50" fill="none" stroke="#fde68a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- Center vein -->
  <line x1="32" y1="12" x2="32" y2="56" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
  <!-- Left veins -->
  <line x1="32" y1="24" x2="21" y2="20" stroke="#15803d" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="32" x2="18" y2="30" stroke="#15803d" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="40" x2="20" y2="40" stroke="#15803d" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- Right veins -->
  <line x1="32" y1="24" x2="43" y2="20" stroke="#15803d" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="32" x2="46" y2="30" stroke="#15803d" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="40" x2="44" y2="40" stroke="#15803d" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- Stem -->
  <line x1="32" y1="56" x2="32" y2="62" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Gold border glow -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.35"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
  </defs>
</svg>
